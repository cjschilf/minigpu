name: RTL

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator

      - name: Run lint and simulation
        run: make test
